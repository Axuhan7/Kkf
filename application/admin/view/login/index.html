<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
    <meta content="telephone=no,email=no" name="format-detection" />
    <title>云宫客服后台登录</title>
    <script>
        YMWL_ROOT_URL = '{$baseroot}';
    </script>
    <!--加载引用文件 -->
    <link href="__libs__/layer/admin/admin.css?v=__lkversion__" rel="stylesheet">
    <link href="__libs__/layer/admin/login.css?v=__lkversion__" rel="stylesheet">
    <link href="__libs__/layer/admin/layui.css?v=__lkversion__" rel="stylesheet">
 
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* 全屏背景 - 南天门 */
        .layadmin-user-login {
            position: relative;
            min-height: 100vh;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
        }

        /* 背景图 - 南天门（跟随鼠标轻微移动） */
        .bg-nantianmen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url(/assets/images/admin/nantianmen-bg.jpg) center center / cover no-repeat;
            z-index: 1;
            transition: transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* 背景光效叠加 */
        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center 40%, rgba(255, 200, 100, 0.15) 0%, transparent 50%);
            z-index: 2;
            pointer-events: none;
        }

        /* 祥云层 - 跟随鼠标移动 */
        .cloud-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
            transition: transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* SVG祥云 */
        .cloud {
            position: absolute;
            opacity: 0.9;
            animation: cloudFloat 6s ease-in-out infinite;
        }

        .cloud img {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 6px 16px rgba(0,0,0,0.3)) drop-shadow(0 2px 4px rgba(139,105,20,0.2));
        }

        .cloud:nth-child(1) { top: 2%; left: 2%; width: 200px; animation-delay: 0s; }
        .cloud:nth-child(2) { top: 12%; right: 3%; width: 240px; animation-delay: 1s; }
        .cloud:nth-child(3) { bottom: 8%; left: 5%; width: 220px; animation-delay: 2s; }
        .cloud:nth-child(4) { bottom: 15%; right: 2%; width: 180px; animation-delay: 0.5s; }
        .cloud:nth-child(5) { top: 38%; left: 1%; width: 160px; animation-delay: 3s; }
        .cloud:nth-child(6) { top: 48%; right: 1%; width: 170px; animation-delay: 1.5s; }
        .cloud:nth-child(7) { top: 68%; left: 12%; width: 140px; animation-delay: 2.5s; }
        .cloud:nth-child(8) { top: 22%; left: 18%; width: 120px; animation-delay: 4s; }
        .cloud:nth-child(9) { bottom: 25%; left: 30%; width: 150px; animation-delay: 1.8s; }

        @keyframes cloudFloat {
            0%, 100% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(-12px) translateX(8px); }
        }

        /* 登录卡片容器 */
        .login-wrapper {
            position: relative;
            z-index: 10;
            padding: 0;
        }

        /* 登录卡片 */
        .layadmin-user-login-main {
            background: rgba(254, 254, 254, 0.95) !important;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), 0 0 40px rgba(255, 215, 0, 0.2);
            padding: 45px 40px 35px !important;
            width: 440px !important;
            position: relative;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        /* 顶部金色装饰条 */
        .layadmin-user-login-main::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, transparent, #FFD700, #FFA500, #FFD700, transparent);
            border-radius: 20px 20px 0 0;
        }

        .layadmin-user-login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 14px;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.5);
            border: 2px solid rgba(255, 215, 0, 0.6);
            transition: transform 0.4s ease;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #fff;
            font-weight: bold;
        }

        .login-logo:hover {
            transform: scale(1.06);
        }

        .login-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .layadmin-user-login-header h2 {
            font-size: 28px;
            color: #8B4513;
            margin: 0;
            font-weight: 700;
            letter-spacing: 6px;
            text-shadow: 1px 1px 2px rgba(255, 215, 0, 0.3);
        }

        .layadmin-user-login-header .tagline {
            font-size: 13px;
            color: #B8860B;
            margin-top: 8px;
            letter-spacing: 3px;
            font-weight: 500;
        }

        /* 西游记经典语录 */
        .journey-quote {
            text-align: center;
            margin-bottom: 28px;
            padding: 12px 20px;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(255, 165, 0, 0.08));
            border-radius: 12px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            position: relative;
        }

        .journey-quote::before,
        .journey-quote::after {
            content: '☁';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            opacity: 0.5;
            color: #DAA520;
        }

        .journey-quote::before { left: 8px; }
        .journey-quote::after { right: 8px; }

        .journey-quote p {
            font-size: 14px;
            color: #8B4513;
            letter-spacing: 2px;
            line-height: 1.8;
            font-weight: 500;
        }

        .layui-form-item {
            margin-bottom: 20px;
        }

        /* 验证码行 flex 布局 */
        .captcha-row {
            display: flex !important;
            align-items: center;
            gap: 12px;
        }

        .captcha-row .layadmin-user-login-icon {
            position: static !important;
            flex-shrink: 0;
            transform: none !important;
        }

        .captcha-input {
            flex: 1;
            padding-left: 10px !important;
        }

        .captcha-row .captcha-input {
            padding: 0 20px 0 10px !important;
        }

        .captcha-row #login-captcha {
            position: static !important;
            transform: none !important;
            height: 44px;
            width: 110px;
            border-radius: 10px;
            cursor: pointer;
            border: 1.5px solid rgba(255, 215, 0, 0.4);
            flex-shrink: 0;
            object-fit: cover;
        }

        .captcha-row #login-captcha:hover {
            border-color: #FFD700;
        }

        .layadmin-user-login-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: #DAA520;
            z-index: 1;
            opacity: 0.7;
        }

        .layui-input {
            height: 46px !important;
            border: 1.5px solid rgba(255, 215, 0, 0.3) !important;
            border-radius: 12px !important;
            padding: 0 20px 0 50px !important;
            font-size: 15px !important;
            background: rgba(255, 255, 255, 0.9) !important;
            transition: all 0.3s ease;
            color: #333 !important;
        }

        .layui-input:focus {
            border-color: #FFD700 !important;
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.2);
            outline: none;
            background: #fff !important;
        }

        .layui-input::placeholder {
            color: #bbb;
        }

        .layui-btn {
            height: 48px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #DAA520, #FFD700, #FFA500);
            border: none;
            box-shadow: 0 6px 20px rgba(218, 165, 32, 0.5);
            transition: all 0.3s ease;
            color: #fff;
            width: 100%;
            cursor: pointer;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }

        .layui-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(218, 165, 32, 0.7);
            background: linear-gradient(135deg, #FFD700, #FFA500, #DAA520);
        }

        .layui-btn:active {
            transform: translateY(0);
            box-shadow: 0 4px 12px rgba(218, 165, 32, 0.4);
        }

        .layadmin-user-login-footer {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            z-index: 10;
            letter-spacing: 1px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }

        @media screen and (max-width: 767px) {
            .layadmin-user-login {
                align-items: flex-start !important;
                padding-top: 10px;
                min-height: 100vh;
                overflow-y: auto;
            }

            .layadmin-user-login-main {
                width: 92% !important;
                padding: 30px 20px 24px !important;
                max-height: calc(100vh - 20px);
                overflow-y: auto;
            }

            .login-wrapper {
                padding: 10px 0;
                width: 100%;
            }

            .layadmin-user-login-header {
                margin-bottom: 20px;
            }

            .login-logo {
                width: 60px;
                height: 60px;
                margin-bottom: 10px;
            }

            .layadmin-user-login-header h2 {
                font-size: 22px;
                letter-spacing: 4px;
            }

            .layadmin-user-login-header .tagline {
                font-size: 12px;
                margin-top: 4px;
            }

            .journey-quote {
                margin-bottom: 20px;
                padding: 10px 16px;
            }

            .journey-quote p {
                font-size: 12px;
                line-height: 1.6;
            }

            .layui-form-item {
                margin-bottom: 14px;
            }

            .layui-input {
                height: 42px !important;
                font-size: 14px !important;
                padding: 0 16px 0 44px !important;
            }

            .layui-btn {
                height: 44px;
                font-size: 16px;
            }

            .captcha-row #login-captcha {
                width: 100px;
                height: 42px;
            }

            .cloud { display: none; }

            .layadmin-user-login-footer {
                position: static;
                padding: 16px 0;
            }
        }

        /* 超小屏幕适配 */
        @media screen and (max-width: 360px) {
            .layadmin-user-login-main {
                padding: 24px 16px 20px !important;
            }

            .layadmin-user-login-header h2 {
                font-size: 20px;
            }

            .login-logo {
                width: 52px;
                height: 52px;
            }

            .journey-quote p {
                font-size: 11px;
            }

            .layui-input {
                height: 40px !important;
            }

            .layui-btn {
                height: 42px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="layadmin-user-login layadmin-user-display-show" id="LAY-user-login" style="display: none;">
        <!-- 背景图 - 南天门（固定） -->
        <div class="bg-nantianmen"></div>
        <!-- 背景光效 -->
        <div class="bg-glow"></div>

        <!-- 祥云层 - 跟随鼠标 -->
        <div class="cloud-layer" id="cloudLayer">
            <div class="cloud"><img src="/assets/images/admin/yun1.png" alt=""></div>
            <div class="cloud"><img src="/assets/images/admin/yun2.png" alt=""></div>
            <div class="cloud"><img src="/assets/images/admin/yun3.png" alt=""></div>
            <div class="cloud"><img src="/assets/images/admin/yun4.png" alt=""></div>
            <div class="cloud"><img src="/assets/images/admin/yun5.png" alt=""></div>
            <div class="cloud"><img src="/assets/images/admin/yun6.png" alt=""></div>
            <div class="cloud"><img src="/assets/images/admin/yun7.png" alt=""></div>
            <div class="cloud"><img src="/assets/images/admin/yun8.png" alt=""></div>
            <div class="cloud"><img src="/assets/images/admin/yun9.png" alt=""></div>
        </div>

        <!-- 登录卡片 -->
        <div class="login-wrapper">
            <div class="layadmin-user-login-main">
                <div class="layadmin-user-login-header">
                    <div class="login-logo">
                        <img src="/upload/images/xitongkefulogo.jpg" alt="云宫" onerror="this.style.display='none'; this.parentNode.textContent='云';">
                    </div>
                    <h2>云 宫</h2>
                    <div class="tagline">客服管理后台</div>
                </div>

                <!-- 西游记经典语录 -->
                <div class="journey-quote">
                    <p>「踏平坎坷成大道，斗罢艰险又出发」</p>
                </div>

                <form method="post" action="{$submit}" class="am-form" data-submit data-am-validator>
                    <div class="layadmin-user-login-body layui-form">
                    <div class="layui-form-item">
                        <label class="layadmin-user-login-icon layui-icon layui-icon-username" for="LAY-user-login-username"></label>
                        <input type="text" name="username" id="LAY-user-login-username" lay-verify="required" placeholder="请输入用户名" class="layui-input">
                    </div>
                    <div class="layui-form-item" id="login-input">
                        <label class="layadmin-user-login-icon layui-icon layui-icon-password" for="password"></label>
                        <input type="password" id="password" name="password" lay-verify="required" placeholder="请输入密码" class="layui-input">
                    </div>
                    <div class="layui-form-item captcha-row">
                        <label class="layadmin-user-login-icon layui-icon layui-icon-vercode" for="LAY-user-login-vercode"></label>
                        <input type="text" name="captcha" lay-verify="required" placeholder="图形验证码" class="layui-input captcha-input" id="LAY-user-login-vercode">
                        <img id="login-captcha" src="{:url('captcha')}?t={:mt_rand()}" class="layadmin-user-login-codeimg" align="absmiddle" onclick="this.src='{:url('captcha')}?_r='+Math.random();" title="不清楚? 点击换一个"/>
                    </div>
                    <input type="hidden" name="business_id" value="{$business_id|default=''}">
                    <div class="layui-form-item">
                        <button id="login-submit" class="layui-btn layui-btn-fluid" lay-submit lay-filter="LAY-user-login-submit">登 入</button>
                    </div>
                    </div>
                    {if $regist == 1}
                    <div class="layui-form-item" style="text-align:center; margin-bottom:0;">
                        <a href="{:url('admin/login/sign')}" style="font-size: 13px; color: #B8860B; text-decoration: none;">没有账号？点击注册</a>
                    </div>
                    {/if}
                </form>    
            </div>
        </div>
        
        <div class="layui-trans layadmin-user-login-footer">
          <p>{if condition="$business && (!empty($business['copyright']) || $business['copyright'] != '')"}{$business['copyright']}{else} © 2026 云宫客服系统{/if}</p>
        </div> 
    </div>

    <script>
        // 祥云跟随鼠标移动 + 南天门背景轻微移动
        (function() {
            var cloudLayer = document.getElementById('cloudLayer');
            var bgNantianmen = document.querySelector('.bg-nantianmen');
            if (!cloudLayer) return;

            var mouseX = 0, mouseY = 0;
            var currentX = 0, currentY = 0;

            document.addEventListener('mousemove', function(e) {
                mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
                mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
            });

            function animate() {
                currentX += (mouseX - currentX) * 0.05;
                currentY += (mouseY - currentY) * 0.05;

                // 祥云层移动幅度较大
                var cloudMoveX = currentX * 30;
                var cloudMoveY = currentY * 20;
                cloudLayer.style.transform = 'translate(' + cloudMoveX + 'px, ' + cloudMoveY + 'px)';

                // 南天门背景轻微移动（幅度小）
                if (bgNantianmen) {
                    var bgMoveX = currentX * 8;
                    var bgMoveY = currentY * 5;
                    bgNantianmen.style.transform = 'translate(' + bgMoveX + 'px, ' + bgMoveY + 'px)';
                }

                requestAnimationFrame(animate);
            }

            animate();
        })();
    </script>
</body>
</html>
