<div id="push-bind-layer-tpl" style="display:none;">
    <div class="push-bind-layer-inner" style="padding:16px 20px 10px;">
        <div style="margin-bottom:12px;">
            <span style="display:inline-block;width:100px;vertical-align:middle;">当前绑定 UID</span>
            <input type="text" readonly disabled class="layui-input push-bind-uid-input" style="display:inline-block;width:200px;vertical-align:middle;">
            <button type="button" class="layui-btn layui-btn-sm push-bind-refresh" style="vertical-align:middle;">刷新</button>
        </div>
        <div style="text-align:center;margin-top:8px;">
            <img class="push-bind-qrcode-img" src="" alt="二维码" style="max-width:260px;">
        </div>
        <p style="color:#999;font-size:12px;margin-top:10px;line-height:1.6;">微信扫码关注后，系统将把 WxPusher 用户 UID 与当前客服账号绑定。</span></p>
    </div>
</div>
<script>
(function () {
    var pushBindUrl = "{:url('admin/index/pushBindQrcode')}";
    var checkBindUrl = "{:url('admin/index/checkPushBind')}";
    function fillPushBind(layero, data) {
        if (!data) return;
        layero.find('.push-bind-uid-input').val(data.push_uid || '');
        var img = layero.find('.push-bind-qrcode-img');
        if (data.qrcode_url) {
            img.attr('src', data.qrcode_url).show();
        } else {
            img.removeAttr('src').hide();
        }
    }
    function openPushBind() {
        var loadIndex = layer.load(1);
        $.get(pushBindUrl, function (res) {
            layer.close(loadIndex);
            if (res.code != 0) {
                layer.msg(res.msg || '加载失败');
                return;
            }
            var timer = null;
            layer.open({
                type: 1,
                title: '绑定推送 UID',
                area: ['440px', '560px'],
                content: $('#push-bind-layer-tpl').html(),
                success: function (layero) {
                    fillPushBind(layero, res.data);
                    timer = setInterval(function () {
                        $.get(checkBindUrl, function (r) {
                            if (r.code == 0 && r.data && r.data.push_uid) {
                                layero.find('.push-bind-uid-input').val(r.data.push_uid);
                                clearInterval(timer);
                                layer.msg('绑定成功');
                            }
                        });
                    }, 3000);
                    layero.find('.push-bind-refresh').on('click', function () {
                        var idx = layer.load(1);
                        $.get(pushBindUrl, function (r2) {
                            layer.close(idx);
                            if (r2.code != 0) {
                                layer.msg(r2.msg || '刷新失败');
                                return;
                            }
                            fillPushBind(layero, r2.data);
                            if (timer) clearInterval(timer);
                            timer = setInterval(function () {
                                $.get(checkBindUrl, function (r) {
                                    if (r.code == 0 && r.data && r.data.push_uid) {
                                        layero.find('.push-bind-uid-input').val(r.data.push_uid);
                                        clearInterval(timer);
                                        layer.msg('绑定成功');
                                    }
                                });
                            }, 3000);
                            layer.msg('已刷新二维码');
                        });
                    });
                },
                end: function () {
                    if (timer) clearInterval(timer);
                }
            });
        });
    }
    $('#btn-bind-push-uid').on('click', function (e) {
        e.preventDefault();
        openPushBind();
    });
})();
</script>
