<style>
    .form-container {
        max-width: 600px;
        padding: 30px;
    }
    .form-title {
        font-size: 18px;
        font-weight: 600;
        color: #333;
        margin-bottom: 24px;
    }
    .form-group {
        margin-bottom: 20px;
    }
    .form-label {
        display: block;
        font-size: 13px;
        color: #666;
        margin-bottom: 8px;
    }
    .form-input {
        width: 100%;
        padding: 10px 16px;
        border: 1px solid #e5e3e9;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
        transition: border-color 0.3s;
    }
    .form-input:focus {
        border-color: #05202d;
    }
    .form-tip {
        font-size: 12px;
        color: #999;
        margin-top: 6px;
    }
    .btn-submit {
        padding: 10px 32px;
        background-color: #05202d;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
    }
    .btn-submit:hover {
        background-color: #0a3050;
    }
    .btn-submit[disabled] {
        opacity: 0.6;
        cursor: not-allowed;
    }
    .btn-back {
        padding: 10px 24px;
        background-color: #f7f7f7;
        color: #666;
        border: 1px solid #e5e3e9;
        border-radius: 8px;
        font-size: 14px;
        text-decoration: none;
        margin-left: 12px;
        display: inline-block;
    }
</style>

<div class="form-container">
    <div class="form-title">添加IP到白名单</div>

    <div id="ipAddForm">
        <div class="form-group">
            <label class="form-label">IP地址 <span style="color: red;">*</span></label>
            <input type="text" id="ip_address" class="form-input" placeholder="请输入IP地址">
            <div class="form-tip">
                支持格式：IPv4（192.168.1.1）、CIDR网段（192.168.1.0/24）、通配符（192.168.1.*）
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">备注说明</label>
            <input type="text" id="remark" class="form-input" placeholder="如：公司办公室IP、管理员家用IP等">
        </div>

        <div class="form-group" style="margin-top: 30px;">
            <button type="button" class="btn-submit" id="submitBtn">保存</button>
            <a href="{:url('adminIp/index')}" class="btn-back">返回列表</a>
        </div>
    </div>
</div>

<script>
$(document).ready(function() {
    $('#submitBtn').on('click', function() {
        var ip = $('#ip_address').val().trim();
        if (!ip) {
            $.myAlert({ content: '请输入IP地址' });
            return;
        }

        var btn = $(this);
        btn.prop('disabled', true).text('提交中...');

        $.ajax({
            url: "/platform/admin_ip/add",
            type: 'post',
            data: { ip_address: ip, remark: $('#remark').val() },
            dataType: 'json',
            success: function(res) {
                if (res.code == 0) {
                    $.myToast({
                        content: res.msg,
                        callback: function() { location.href = "{:url('adminIp/index')}"; }
                    });
                } else {
                    $.myAlert({ content: res.msg });
                    btn.prop('disabled', false).text('保存');
                }
            },
            error: function() {
                $.myAlert({ content: '网络错误，请重试' });
                btn.prop('disabled', false).text('保存');
            }
        });
    });

    // 阻止回车触发表单提交
    $('#ipAddForm').on('keydown', function(e) {
        if (e.keyCode == 13) {
            e.preventDefault();
            $('#submitBtn').trigger('click');
        }
    });
});
</script>
